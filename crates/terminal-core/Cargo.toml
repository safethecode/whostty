[package]
name = "whostty-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
alacritty_terminal = "=0.25.1"
anyhow = "1"
dirs = "6"
portable-pty = "=0.9.0"
regex = "1"
serde = { version = "1", features = ["derive"] }
tempfile = "3"
toml = "0.8"
url = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_Storage_FileSystem", "Win32_Security_Authorization"] }
