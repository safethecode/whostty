[package]
name = "whostty"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
eframe = { version = "=0.31.1", default-features = false, features = ["wgpu", "default_fonts", "accesskit"] }
whostty-core = { path = "../terminal-core" }
ttf-parser = "0.25"
unicode-normalization = "0.1"
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_Console"] }

[build-dependencies]
winresource = { version = "=0.1.34", default-features = false }

