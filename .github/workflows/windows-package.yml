name: Windows package

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about@0.9.2
      - name: Build portable Windows package
        shell: pwsh
        run: ./scripts/build-windows.ps1
      - name: Verify executable and package contents
        run: python scripts/verify_windows_package.py dist/whostty-windows-x64.zip
      - name: Check packaged native PTY and GPU rendering
        shell: pwsh
        run: |
          $runtimeDirectory = Join-Path $env:RUNNER_TEMP 'whostty-native-runtime'
          Expand-Archive -LiteralPath dist/whostty-windows-x64.zip -DestinationPath $runtimeDirectory -Force
          foreach ($scale in @(1.0, 1.25, 1.5, 2.0)) {
            $percent = [int]($scale * 100)
            ./scripts/check-windows-runtime.ps1 -Executable (Join-Path $runtimeDirectory 'whostty.exe') -Scale $scale -ReportPath "dist/whostty-runtime-check-$percent.json"
          }
      - uses: actions/upload-artifact@v4
        with:
          name: whostty-windows-x64
          path: |
            dist/whostty-windows-x64.zip
            dist/whostty-windows-x64.zip.sha256
            dist/whostty-runtime-check-*.json
          if-no-files-found: error
          retention-days: 14
