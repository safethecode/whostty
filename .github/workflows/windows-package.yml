name: Windows package

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about@0.9.2
      - name: Build portable Windows package
        shell: pwsh
        run: ./scripts/build-windows.ps1
      - name: Verify executable and package contents
        run: python scripts/verify_windows_package.py dist/whostty-windows-x64.zip
      - name: Check packaged native PTY and GPU rendering
        shell: pwsh
        run: |
          $runtimeDirectory = Join-Path $env:RUNNER_TEMP 'whostty-native-runtime'
          Expand-Archive -LiteralPath dist/whostty-windows-x64.zip -DestinationPath $runtimeDirectory -Force
          foreach ($scale in @(1.0, 1.25, 1.5, 2.0)) {
            $percent = [int]($scale * 100)
            ./scripts/check-windows-runtime.ps1 -Executable (Join-Path $runtimeDirectory 'whostty.exe') -RequireBundledConpty -Scale $scale -ReportPath "dist/whostty-runtime-check-$percent.json"
          }
          ./scripts/check-windows-runtime.ps1 -Executable (Join-Path $runtimeDirectory 'whostty.exe') -RequireBundledConpty -Scale 1.25 -LatencySamples 10 -ReportPath dist/whostty-input-latency-smoke.json
      - name: Record controlled native memory baselines
        shell: pwsh
        env:
          WGPU_BACKEND: dx12
        run: |
          $runtimeExe = Join-Path $env:RUNNER_TEMP 'whostty-native-runtime/whostty.exe'
          foreach ($history in @(0, 10000)) {
            python scripts/windows-soak.py --exe $runtimeExe --output "dist/memory-history-$history" --idle-seconds 8 --duration 20 --warmup-seconds 2 --alternate-interval 0 --scrollback $history --memory-map --close-on-success
            if ($LASTEXITCODE -ne 0) { throw "Native memory diagnostic failed ($history)" }
          }
          python scripts/verify_memory_budget.py dist/memory-history-0 dist/memory-history-10000
          if ($LASTEXITCODE -ne 0) { throw 'Default memory regression budget exceeded' }
          foreach ($mode in @('memory', 'performance')) {
            $env:WHOSTTY_GPU_MEMORY_MODE = $mode
            ./scripts/check-windows-runtime.ps1 -Executable $runtimeExe -RequireBundledConpty -LatencySamples 10 -ReportPath "dist/gpu-$mode-check.json"
            python scripts/windows-soak.py --exe $runtimeExe --output "dist/memory-gpu-$mode" --idle-seconds 8 --duration 20 --warmup-seconds 2 --alternate-interval 0 --scrollback 0 --memory-map --close-on-success
            if ($LASTEXITCODE -ne 0) { throw "GPU memory ablation failed ($mode)" }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: whostty-windows-x64
          path: |
            dist/whostty-windows-x64.zip
            dist/whostty-windows-x64.zip.sha256
            dist/whostty-runtime-check-*.json
            dist/whostty-input-latency-smoke.json
            dist/memory-history-0/
            dist/memory-history-10000/
            dist/memory-gpu-*/
            dist/gpu-*-check.json
          if-no-files-found: error
          retention-days: 14
