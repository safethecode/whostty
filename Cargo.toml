[workspace]
members = ["crates/terminal-core", "crates/desktop"]
default-members = ["crates/desktop"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/safethecode/Whostty"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
